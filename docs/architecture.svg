<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="The same prompt goes to two isolated Docker containers running Claude Code. Each container also gets its own agent folder (AGENTS.md, skills, ...). Both produce metrics, transcripts and workspaces, which are scanned with Trivy and compared.">
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .node{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5}
    .hl-a{fill:#fdf1ea;stroke:#d97757;stroke-width:1.5}
    .hl-b{fill:#eaf2fd;stroke:#3b82f6;stroke-width:1.5}
    .hl{fill:#f6f8fa;stroke:#8c959f;stroke-width:1.5}
    .ctr-a{fill:#fdf6f2;stroke:#d97757;stroke-width:2}
    .ctr-b{fill:#f3f7fe;stroke:#3b82f6;stroke-width:2}
    .t,.s,.h{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;text-anchor:middle}
    .t{fill:#1f2328;font-size:15px;font-weight:600}
    .s{fill:#59636e;font-size:12.5px}
    .h{font-size:12px;font-weight:700;letter-spacing:.6px}
    .h-a{fill:#b5532f}
    .h-b{fill:#1d4ed8}
    .wire{fill:none;stroke:#8c959f;stroke-width:1.6}
    .wire-a{fill:none;stroke:#d97757;stroke-width:1.6;stroke-dasharray:5 4}
    .wire-b{fill:none;stroke:#3b82f6;stroke-width:1.6;stroke-dasharray:5 4}
    .tip{fill:#8c959f}
    .tip-a{fill:#d97757}
    .tip-b{fill:#3b82f6}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117;stroke:#30363d}
      .node{fill:#161b22;stroke:#30363d}
      .hl-a{fill:#2d1d16;stroke:#e08a68}
      .hl-b{fill:#142238;stroke:#60a5fa}
      .hl{fill:#161b22;stroke:#6e7681}
      .ctr-a{fill:#1f1612;stroke:#e08a68}
      .ctr-b{fill:#101a2b;stroke:#60a5fa}
      .t{fill:#e6edf3}
      .s{fill:#9198a1}
      .h-a{fill:#e08a68}
      .h-b{fill:#60a5fa}
      .wire{stroke:#6e7681}
      .wire-a{stroke:#e08a68}
      .wire-b{stroke:#60a5fa}
      .tip{fill:#6e7681}
      .tip-a{fill:#e08a68}
      .tip-b{fill:#60a5fa}
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="tip-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip-a" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="tip-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="tip-b" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="419" rx="12"/>

  <!-- inputs -->
  <rect class="hl-a" x="20" y="48" width="160" height="56" rx="8"/>
  <text class="t" x="100" y="72">inputs/agent_a</text>
  <text class="s" x="100" y="91">AGENTS.md, skills, ...</text>

  <rect class="node" x="20" y="182" width="160" height="56" rx="8"/>
  <text class="t" x="100" y="206">Prompt</text>
  <text class="s" x="100" y="225">same for both agents</text>

  <rect class="hl-b" x="20" y="316" width="160" height="56" rx="8"/>
  <text class="t" x="100" y="340">inputs/agent_b</text>
  <text class="s" x="100" y="359">AGENTS.md, skills, ...</text>

  <path class="wire-a" d="M180 76 H228" marker-end="url(#tip-a)"/>
  <path class="wire" d="M180 210 H205 V120 H228" marker-end="url(#tip)"/>
  <path class="wire" d="M205 210 V290 H228" marker-end="url(#tip)"/>
  <path class="wire-b" d="M180 344 H228" marker-end="url(#tip-b)"/>

  <!-- container A -->
  <rect class="ctr-a" x="230" y="20" width="300" height="172" rx="12"/>
  <text class="h h-a" x="380" y="42">CONTAINER A</text>
  <rect class="node" x="250" y="54" width="260" height="56" rx="8"/>
  <text class="t" x="380" y="77">/workspace</text>
  <text class="s" x="380" y="96">project + agent_a folder</text>
  <rect class="node" x="250" y="122" width="260" height="56" rx="8"/>
  <text class="t" x="380" y="145">Claude Code</text>
  <text class="s" x="380" y="164">headless · same model &amp; version</text>

  <!-- container B -->
  <rect class="ctr-b" x="230" y="228" width="300" height="172" rx="12"/>
  <text class="h h-b" x="380" y="250">CONTAINER B</text>
  <rect class="node" x="250" y="262" width="260" height="56" rx="8"/>
  <text class="t" x="380" y="285">/workspace</text>
  <text class="s" x="380" y="304">project + agent_b folder</text>
  <rect class="node" x="250" y="330" width="260" height="56" rx="8"/>
  <text class="t" x="380" y="353">Claude Code</text>
  <text class="s" x="380" y="372">headless · same model &amp; version</text>

  <!-- outputs -->
  <path class="wire" d="M530 106 H565 V314 H530"/>
  <path class="wire" d="M565 160 H588" marker-end="url(#tip)"/>
  <path class="wire" d="M565 260 H588" marker-end="url(#tip)"/>

  <rect class="node" x="590" y="128" width="200" height="64" rx="8"/>
  <text class="t" x="690" y="155">Metrics &amp; transcripts</text>
  <text class="s" x="690" y="174">time · turns · tokens · cost</text>

  <rect class="node" x="590" y="228" width="200" height="64" rx="8"/>
  <text class="t" x="690" y="255">Copied workspaces</text>
  <text class="s" x="690" y="274">A and B, side by side</text>

  <path class="wire" d="M790 260 H810" marker-end="url(#tip)"/>
  <rect class="hl" x="812" y="228" width="128" height="64" rx="8"/>
  <text class="t" x="876" y="255">Trivy scan</text>
  <text class="s" x="876" y="274">A vs B by severity</text>
</svg>
